# Generated by ratelimit2apache.py from config.yaml.
# Requires mod_evasive (Debian/Ubuntu: libapache2-mod-evasive; a2enmod evasive).
# Server or <VirtualHost> context only: mod_evasive directives are not valid in .htaccess.

# 60 requests per minute per client IP, counted over 60 s; an address over the limit is refused for 60 s.
# burst (20) has no mod_evasive equivalent and is not applied.
<IfDirective DOSEnabled>
    DOSEnabled true
</IfDirective>
DOSHashTableSize 3097
DOSSiteCount 60
DOSSiteInterval 60
DOSPageCount 60
DOSPageInterval 60
DOSBlockingPeriod 60
# path /login (10 requests per minute) not generated: mod_evasive has no per-path limits
# path /api (120 requests per minute) not generated: mod_evasive has no per-path limits
# path /search/(.*) (100 requests per minute) not generated: mod_evasive has no per-path limits
